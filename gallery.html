  <script>
    const events = [
    {
        title: "Quantum Cryptography Workshop",
        date: "October 14, 2025",
        image: "assets/img/events/quantum_cryptography_workshop.jpg",
        file: "quantum-cryptography.html"
    }, 
    {
        title: "From Sea to Space: Science pour tous", 
        date: "October 4, 2025",
        image: "assets/img/events/lego.jpg",
        file: "sea-to-space.html"
    },

    {
        title: "We Gatherin': Bellairs, Barbados", 
        date: "September 30, 2025",
        image: "assets/img/events/bellairs/GroupStudents.jpeg",
        file: "bellairs-physics.html"
    }];


    const container = document.getElementById("events-container");
    events.forEach(ev => {
    const div = document.createElement("a");
    div.className = "gallery-card";
    // Go to /events/<filename>.html
    div.href = `./outreach-events/${ev.file}`;
    div.innerHTML = `
        <img src="${ev.image}" alt="${ev.title}" loading="lazy">
        <div class="content">
        <h3>${ev.title}</h3>
        <p>${ev.date}</p>
        </div>`;
    container.appendChild(div);
    });
  </script>
